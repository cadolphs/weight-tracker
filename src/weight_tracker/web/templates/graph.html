<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight history</title>
  <link rel="stylesheet" href="/static/uplot.min.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <main id="graph-page" data-view="{{ view }}" data-scale="{{ scale }}">
    <h1>Weight history</h1>
    <!-- Buttons deliberately carry data-lens / data-window (never data-view /
         data-scale): the page state attributes on #graph-page must stay the only
         markup matching the acceptance contract. -->
    <nav id="view-toggle" aria-label="Graph lens">
      <button data-lens="trend">Trend</button>
      <button data-lens="raw">Raw</button>
    </nav>
    <nav id="scale-picker" aria-label="Time scale">
      <button data-window="1W">1W</button>
      <button data-window="1M">1M</button>
      <button data-window="3M">3M</button>
      <button data-window="6M">6M</button>
      <button data-window="1Y">1Y</button>
      <button data-window="ALL">All</button>
    </nav>
    <div id="chart"></div>
    {% if history_rows %}
    <h2>Complete record</h2>
    <!-- The whole record, newest first, server-rendered from the same read the
         raw plot draws (US-012, D-17). Display-only rows: no per-row markup,
         handlers, or affordances (02-02's budget depends on lean rows). -->
    <ul id="history-entries">
      {% for row in history_rows %}<li>{{ row }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    <p id="empty-invite" hidden>No entries yet — <a href="/">log your first weight</a>.</p>
    <p><a href="/">Back to today's entry</a></p>
  </main>
  <!-- ONE shared graph engine for both surfaces (ADR-008): the chart logic that
       lived inline here now ships as /static/graph.js, configured by this page's
       #graph-page mount (data-view / data-scale). Deferred, same-origin, in order. -->
  <script src="/static/uplot.iife.min.js" defer></script>
  <script src="/static/graph.js" defer></script>
</body>
</html>
