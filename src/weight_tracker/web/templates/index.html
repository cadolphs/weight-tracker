<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/uplot.min.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <main>
    <h1>Log today's weight</h1>
    {% if glance_text is not none %}
    <p id="trend-glance">{{ glance_text }}</p>
    {% endif %}
    {% if recent_weights %}
    <!-- Ambient morning picture (US-010, ADR-008): the whole record's trend curve
         ABOVE the entry form, driven by the same shared engine as the History page.
         The mount's data-view/data-scale carry the page state exactly like
         #graph-page does; buttons speak only data-lens/data-window (control
         grammar). The front page ALWAYS opens at the ambient defaults (A17/D-20):
         no query parameter reaches this markup. Rendered only when entries exist
         -- an empty record keeps the front page simple (A18 kin). -->
    <section id="home-graph" data-view="trend" data-scale="3M" aria-label="Weight trend">
      <nav id="view-toggle" aria-label="Graph lens">
        <button data-lens="trend">Trend</button>
        <button data-lens="raw">Raw</button>
      </nav>
      <nav id="scale-picker" aria-label="Time scale">
        <button data-window="1W">1W</button>
        <button data-window="1M">1M</button>
        <button data-window="3M">3M</button>
        <button data-window="6M">6M</button>
        <button data-window="1Y">1Y</button>
        <button data-window="ALL">All</button>
      </nav>
      <div id="chart"></div>
    </section>
    {% endif %}
    <form method="post" action="/entries">
      <label for="weight">Weight (kg)</label>
      <input id="weight" name="weight" inputmode="decimal" autocomplete="off" autofocus>
      <p id="yesterday-reference" hidden></p>
      <button type="submit">Save</button>
      <p id="save-feedback" role="alert" hidden></p>
    </form>
    <p><a href="/graph">History</a></p>
  </main>
  <!-- ONE shared graph engine (ADR-008), deferred and same-origin (G-5 as
       renegotiated): it finds the #home-graph mount when the record has entries
       and stays silent otherwise. -->
  <script src="/static/uplot.iife.min.js" defer></script>
  <script src="/static/graph.js" defer></script>
  <script>
    // Device-local day (A5): the phone's calendar day, not UTC.
    function isoLocalDay(moment) {
      const pad = (part) => String(part).padStart(2, "0");
      return `${moment.getFullYear()}-${pad(moment.getMonth() + 1)}-${pad(moment.getDate())}`;
    }
    function deviceLocalDay() {
      return isoLocalDay(new Date());
    }

    // Client-authoritative yesterday anchor (A5 extended to reads,
    // fix-device-day-reads): the server hands the recent days; the PHONE
    // resolves which one is "yesterday" in its own calendar -- after a UTC
    // rollover the evening at home is still today, never tomorrow.
    const recentWeights = {{ recent_weights | tojson }};
    (function renderYesterdayAnchor() {
      const anchor = document.getElementById("yesterday-reference");
      const deviceYesterday = new Date();
      deviceYesterday.setDate(deviceYesterday.getDate() - 1);
      const loggedKg = recentWeights[isoLocalDay(deviceYesterday)];
      if (loggedKg === undefined) {
        anchor.remove();  // present only when a value exists (first-morning honesty)
        return;
      }
      anchor.textContent = `yesterday: ${loggedKg.toFixed(1)} kg`;
      anchor.hidden = false;
    })();

    // Inline save flow: confirmation or corrective message beside the field.
    // On rejection the typed value stays in the input for correction.
    const entryForm = document.querySelector("form");
    const weightInput = document.getElementById("weight");
    const feedback = document.getElementById("save-feedback");

    // In-place glance refresh (D-13): the saved response carries the glance
    // recomputed with today's entry -- no reload, no extra fetch. A degraded
    // save (glance null) hides the line: absent, never stale (D-13 pin).
    function refreshGlance(glanceText) {
      let glanceLine = document.getElementById("trend-glance");
      if (glanceText == null) {
        if (glanceLine) glanceLine.remove();
        return;
      }
      if (!glanceLine) {
        glanceLine = document.createElement("p");
        glanceLine.id = "trend-glance";
        entryForm.parentNode.insertBefore(glanceLine, entryForm);
      }
      glanceLine.textContent = glanceText;
    }

    entryForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/entries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          date: deviceLocalDay(),
          weight: weightInput.value,
          // KPI-1: client-measured duration from screen-interactive to save tap.
          entry_ms: Math.round(performance.now()),
        }),
      });
      const outcome = await response.json();
      feedback.hidden = false;
      if (outcome.outcome === "saved") {
        feedback.textContent = outcome.confirmation;
        refreshGlance(outcome.glance);
        weightInput.value = "";
      } else {
        feedback.textContent = outcome.message;
        weightInput.value = outcome.echo;
      }
      weightInput.focus();
    });

    // Installable PWA (D-11): app-shell cache only, no offline queueing.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
