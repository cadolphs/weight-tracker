<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/uplot.min.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  <main>
    <h1>Log today's weight</h1>
    {% if glance_text is not none %}
    <p id="trend-glance">{{ glance_text }}</p>
    {% endif %}
    {% if record_weights %}
    <!-- Ambient morning picture (US-010, ADR-008): the whole record's trend curve
         ABOVE the entry form, driven by the same shared engine as the History page.
         The mount's data-view/data-scale carry the page state exactly like
         #graph-page does; buttons speak only data-lens/data-window (control
         grammar). The front page ALWAYS opens at the ambient defaults (A17/D-20):
         no query parameter reaches this markup. Rendered only when entries exist
         -- an empty record keeps the front page simple (A18 kin). -->
    <section id="home-graph" data-view="trend" data-scale="3M" aria-label="Weight trend">
      <nav id="view-toggle" aria-label="Graph lens">
        <button data-lens="trend">Trend</button>
        <button data-lens="raw">Raw</button>
      </nav>
      <nav id="scale-picker" aria-label="Time scale">
        <button data-window="1W">1W</button>
        <button data-window="1M">1M</button>
        <button data-window="3M">3M</button>
        <button data-window="6M">6M</button>
        <button data-window="1Y">1Y</button>
        <button data-window="ALL">All</button>
      </nav>
      <div id="chart"></div>
    </section>
    {% endif %}
    <form method="post" action="/entries">
      <!-- The date row (US-013, D6/D-25): the phone's OWN native picker, resting
           inside the form ABOVE the weight field, so a forgotten Sunday or a
           fat-fingered Tuesday is repaired where the habit already lives.
           It deliberately claims NO focus of its own -- the morning keypad still
           comes up on the weight field below and the default flow costs exactly
           the taps it always did (KPI-1 guardrail). `value` and `max` are set by
           the inline script
           below, because only the phone knows its own calendar day (A5); `min` is
           the server's, the record's first day minus a year (OQ-11), and is
           absent entirely on an empty record -- no sentinel, no empty attribute.
           All three are UX assist only: validate_entry_date remains the sole
           authority on what may be saved, and a forged future date is still
           rejected exactly as before. The box is value-independent and inherits
           the shipped `input { min-height: 44px; width: 100% }`, so the form
           never jumps under the thumb. -->
      <label for="entry-date">Date</label>
      <input type="date" id="entry-date"{% if earliest_pickable_day %} min="{{ earliest_pickable_day.isoformat() }}"{% endif %}>
      <label for="weight">Weight (kg)</label>
      <input id="weight" name="weight" inputmode="decimal" autocomplete="off" autofocus>
      <!-- The ONE hint line (US-014, D-24/A21): a single node serves all three
           things the entry screen ever has to say beside the field -- yesterday's
           anchor on today, "Editing {day} — was {v} kg" when a stored day is
           picked, and "No entry for {day} yet" when the picked day is a gap.
           "Never two hints at once" is STRUCTURAL rather than conventional:
           there is one node, and it is never removed. It ships empty and stays in
           the flow when it has nothing to say, so its height is reserved and the
           form never jumps under the thumb mid-session. Its text comes from the
           pure hintFor() below; this is the only place the hint is written. -->
      <p id="entry-hint"></p>
      <button type="submit">Save</button>
      <p id="save-feedback" role="alert" hidden></p>
    </form>
    {% if recent_entries %}
    <!-- Recent entries (US-011, A18/D9): the last 7 ENTRIES newest first, resting
         below the form -- server-rendered from the SAME entry read as everything
         above, display-only rows in the one shared grammar. Looking is not
         touching: no links, no buttons, no edit or delete. Absent entirely on an
         empty record; missing days are simply absent, never zeros. -->
    <ul id="recent-entries" aria-label="Recent entries">
      {% for row in recent_entries %}
      <li>{{ row }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    <p><a href="/graph">History</a></p>
  </main>
  <!-- ONE shared graph engine (ADR-008), deferred and same-origin (G-5 as
       renegotiated): it finds the #home-graph mount when the record has entries
       and stays silent otherwise. -->
  <script src="/static/uplot.iife.min.js" defer></script>
  <script src="/static/graph.js" defer></script>
  <script>
    // Device-local day (A5): the phone's calendar day, not UTC.
    function isoLocalDay(moment) {
      const pad = (part) => String(part).padStart(2, "0");
      return `${moment.getFullYear()}-${pad(moment.getMonth() + 1)}-${pad(moment.getDate())}`;
    }
    function deviceLocalDay() {
      return isoLocalDay(new Date());
    }
    // The calendar day before a given one, by calendar arithmetic rather than by
    // subtracting 86,400,000 ms -- month ends and DST shifts stay honest. PURE:
    // an ISO day in, an ISO day out, no reading of the clock.
    function dayBefore(isoDay) {
      const [year, month, day] = isoDay.split("-").map(Number);
      return isoLocalDay(new Date(year, month - 1, day - 1));
    }

    // The one row grammar, spoken client-side for the in-place repaint (A18):
    // 'Fri 24 Jul — 82.2 kg' -- weekday, day without a leading zero, month. Its
    // day half is dayLabel(), shared with the hint line below (D-24) so the
    // screen can never fork into a second calendar wording; the server speaks
    // the same one in entry_row_text and in every save confirmation.
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function dayLabel(isoDay) {
      const [year, month, day] = isoDay.split("-").map(Number);
      const weekday = WEEKDAYS[new Date(year, month - 1, day).getDay()];
      return `${weekday} ${day} ${MONTHS[month - 1]}`;
    }
    function entryRowText(isoDate, weightKg) {
      return `${dayLabel(isoDate)} — ${weightKg.toFixed(1)} kg`;
    }

    // The WHOLE record as {iso_day: kg} (ADR-010): ONE map answers both the
    // yesterday anchor and the edit prefill, so the two can never disagree.
    // A day with no entry is simply absent -- a gap stays a gap.
    const recordWeights = {{ record_weights | tojson }};

    // What the phone currently knows the record to hold. It starts as the
    // server's hand-back above and is REPLACED (never mutated) by a merge of
    // each save's own answer, so the anchor and the prefill stay fresh without a
    // reload. Degrade-to-absent: a page served without a map leaves this empty
    // and the hint simply says less -- entry and save are untouched either way.
    let knownWeights = recordWeights || {};

    // The three things the screen ever has to say beside the field, as ONE pure
    // function (D-24/A21): the day picked, the phone's own day, and what the
    // record holds go in; a line -- or null for "nothing to say" -- comes out.
    // No DOM read, no clock read, no global lookup: everything it needs is an
    // argument, which is what keeps the three states mutually exclusive by
    // construction instead of by convention (ADR-005 in the client).
    function hintFor(selectedDay, deviceToday, weightsByDay) {
      if (!selectedDay || selectedDay === deviceToday) {
        const yesterdayKg = weightsByDay[dayBefore(deviceToday)];
        // First-morning honesty: with nothing behind today, the line says nothing.
        return yesterdayKg === undefined ? null : `yesterday: ${yesterdayKg.toFixed(1)} kg`;
      }
      const storedKg = weightsByDay[selectedDay];
      if (storedKg === undefined) {
        return `No entry for ${dayLabel(selectedDay)} yet`;
      }
      return `Editing ${dayLabel(selectedDay)} — was ${storedKg.toFixed(1)} kg`;
    }

    const entryForm = document.querySelector("form");
    const dateInput = document.getElementById("entry-date");
    const weightInput = document.getElementById("weight");
    const entryHint = document.getElementById("entry-hint");
    const feedback = document.getElementById("save-feedback");

    // THE apply site for the hint (FC/IS in the client): the only place the one
    // node is written. It is never removed -- an empty line still holds its
    // height, so nothing reflows under the thumb when the picked day changes.
    function paintHint() {
      const line = hintFor(dateInput.value, deviceLocalDay(), knownWeights);
      entryHint.textContent = line === null ? "" : line;
    }

    // The date row's own two ends, framed by the DEVICE (A5/D-25): where the
    // picker opens (`value` = today) and how far forward it may reach (`max` =
    // today, so the future stays closed at the picker as well as at the save).
    // The server cannot know the phone's calendar day, which is why these two
    // are set here and only `min` arrives rendered. Reading the same one
    // deviceLocalDay() the save already speaks keeps the anchor, the picker and
    // the submitted day on a single calendar rule. Looking is not touching:
    // setting .value / .max never moves focus, so the morning keypad stays on
    // the weight field. ONE apply site, right here (FC/IS in the client).
    (function frameDateRowOnDeviceDay() {
      dateInput.value = deviceLocalDay();
      dateInput.max = deviceLocalDay();
    })();

    // Picking a day re-derives the one line: yesterday's anchor on today, the
    // stored value offered back on a day the record holds, the gap admitted
    // otherwise. Client-authoritative throughout (A5 extended to reads): the
    // server hands over the record, the PHONE decides which day is which.
    dateInput.addEventListener("change", paintHint);
    paintHint();

    // In-place glance refresh (D-13): the saved response carries the glance
    // recomputed with today's entry -- no reload, no extra fetch. A degraded
    // save (glance null) hides the line: absent, never stale (D-13 pin).
    function refreshGlance(glanceText) {
      let glanceLine = document.getElementById("trend-glance");
      if (glanceText == null) {
        if (glanceLine) glanceLine.remove();
        return;
      }
      if (!glanceLine) {
        glanceLine = document.createElement("p");
        glanceLine.id = "trend-glance";
        entryForm.parentNode.insertBefore(glanceLine, entryForm);
      }
      glanceLine.textContent = glanceText;
    }

    // In-place recent-list repaint (D-19): rebuilt from the save's own hand-back
    // -- no reload, no extra fetch. A missing or empty hand-back removes the
    // list: absent, never stale (D-13 pin extended).
    function refreshRecentList(recent) {
      let list = document.getElementById("recent-entries");
      if (!recent || recent.length === 0) {
        if (list) list.remove();
        return;
      }
      if (!list) {
        list = document.createElement("ul");
        list.id = "recent-entries";
        list.setAttribute("aria-label", "Recent entries");
        entryForm.insertAdjacentElement("afterend", list);
      }
      list.replaceChildren(...recent.map((entry) => {
        const row = document.createElement("li");
        row.textContent = entryRowText(entry.date, entry.weight_kg);
        return row;
      }));
    }

    // What the phone now knows, after a save answered (ADR-010). PURE: the map
    // it was handed and the save's own answer go in, a NEW map comes out --
    // nothing is mutated in place. The saved day and the refreshed tail of the
    // record are both already on the wire, so keeping the anchor and the prefill
    // fresh costs no reload and no second fetch.
    function mergedRecord(weightsByDay, outcome) {
      const answered = {};
      for (const entry of outcome.recent || []) {
        answered[entry.date] = entry.weight_kg;
      }
      if (outcome.date != null && outcome.weight_kg != null) {
        answered[outcome.date] = outcome.weight_kg;
      }
      return { ...weightsByDay, ...answered };
    }

    // Inline save flow: confirmation or corrective message beside the field.
    // On rejection the typed value stays in the input for correction.
    entryForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/entries", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          // The day being SAVED (the picked one, today unless it was moved) and,
          // separately, the day the phone believes it IS. Sending both is what
          // lets the server decide at write time whether this was a morning or a
          // repair (ADR-011) -- a rule that rests on what arrives on the wire,
          // never on a client convention about what it omits.
          date: dateInput.value || deviceLocalDay(),
          today: deviceLocalDay(),
          weight: weightInput.value,
          // KPI-1: client-measured duration from screen-interactive to save tap.
          entry_ms: Math.round(performance.now()),
        }),
      });
      const outcome = await response.json();
      feedback.hidden = false;
      if (outcome.outcome === "saved") {
        feedback.textContent = outcome.confirmation;
        knownWeights = mergedRecord(knownWeights, outcome);
        refreshGlance(outcome.glance);
        refreshRecentList(outcome.recent);
        // Post-save repaint (A15): the shared engine refetches the graph at its
        // CURRENT lens/scale -- listening in graph.js, silent when no mount exists.
        document.dispatchEvent(new CustomEvent("entry-saved"));
        weightInput.value = "";
        // Back to today (D8/A22): repairing a past day is a detour, not a new
        // habit. Backfill yesterday, then log this morning -- without this reset
        // the second, habit-typed entry would silently overwrite the first.
        dateInput.value = deviceLocalDay();
        paintHint();
      } else {
        feedback.textContent = outcome.message;
        weightInput.value = outcome.echo;
      }
      weightInput.focus();
    });

    // Installable PWA (D-11): app-shell cache only, no offline queueing.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
