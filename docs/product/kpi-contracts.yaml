# KPI instrumentation contracts — weight-tracker
# Source KPIs: docs/feature/weight-trend-tracker/feature-delta.md § [REF] Outcome KPIs
# Storage: same SQLite DB as entries. events table is append-only:
#   events(id INTEGER PRIMARY KEY, ts TEXT NOT NULL, name TEXT NOT NULL, payload TEXT)  -- payload = JSON
# Query surface: /stats read-only page (AccessGate-protected); SQL below doubles as the
# ad-hoc notebook interface (sqlite3 against the live file or a restored replica).
generated_by: nw-platform-architect
date: 2026-07-22

events:
  - name: entry_logged
    emitted: server-side, on successful record_or_replace (Saved only, never Rejected)
    fields:
      date: "ISO date of the entry (device-local calendar day)"
      entry_ms: "client-measured ms, icon tap -> save confirmation (nullable: absent pre-Slice-05)"
      kind: "today | backfill | correction"
  - name: trend_view_opened
    emitted: server-side, on trend page/series render
    fields:
      date: "ISO date (server UTC)"
  - name: health.startup.refused
    emitted: structured log only (stdout), NOT an events row — machine may have no working DB
    fields:
      probe: "name of the failed driven-adapter probe"
      reason: "failure detail"
  # NOTE (DISTILL 2026-07-23, home-trend-display): canonical on-trail names use the
  # CODE grammar (dotted): routes.py emits `entry.saved` and `trend.view.opened` for
  # the two events above; the /stats JSON keys are the snake_case spellings
  # (entry_logged_count, trend_view_opened_count). New events follow the code grammar.
  - name: trend.glance.shown
    emitted: server-side, per glance DELIVERY (each GET / render carrying glance data and
      each saved POST /entries response carrying glance; never on rejected saves; never
      from GET /trend — KPI-3 separation is structural, D-13/D-14). No per-day dedup;
      KPI-5's per-calendar-day pairing is computed at read time from the trail.
    fields:
      date: "ISO date (server UTC) of the delivery"
  # --- graph-first-home (DISTILL 2026-07-24, ADR-009: intent telemetry) ---------
  # RETIREMENT: the trend.view.opened EMISSION on GET /trend retires with this
  # feature — series/history reads become pure reads. Historical rows stay on the
  # append-only trail; /stats keeps trend_view_opened_count as a FROZEN historical
  # counter. Deliberate study moves to the trend.study.* events below (KPI-3's
  # redefinition); ambient graph presence gets its own event (KPI-7).
  - name: home.graph.shown
    emitted: server-side, on each GET / render when entries exist — an AMBIENT
      data-available-at-render delivery proxy (Q3, glance precedent; client paint
      is not measured). Per delivery, no per-day dedup; KPI-7's pairing with
      entry.saved per calendar day is computed at read time on /stats.
    fields:
      date: "ISO date (server UTC) of the delivery"
  - name: trend.study.opened
    emitted: server-side, on each GET /graph (History page) render — one DELIBERATE
      study signal per open, regardless of ?view=/?scale= deep link or record state.
    fields:
      date: "ISO date (server UTC)"
  - name: trend.study.interaction
    emitted: server-side, by POST /telemetry/trend-study (fire-and-forget beacon
      from explicit lens/scale taps on EITHER surface; A19/OQ-8 confirmed). Closed
      vocabulary — surface in {home, history}, control in {lens, scale}, value from
      the known token sets; anything else → 400, never 500, never a trail write.
      Behind AccessGate like every route.
    fields:
      surface: "home | history"
      control: "lens | scale"
      value: "trend|raw or 1W|1M|3M|6M|1Y|ALL"

kpis:
  - id: KPI-1
    name: entry-timing
    type: leading
    target: { median_ms: 5000, p90_ms: 10000, window: rolling 7 days }
    baseline: "30000-45000 ms (old app, estimated)"
    instrument: entries.entry_ms (persisted with each save; entry_logged event mirrors it)
    storage: entries table + events table
    query: |
      SELECT COUNT(*) n, AVG(entry_ms) avg_ms FROM entries
      WHERE date >= date('now','-7 day') AND entry_ms IS NOT NULL;
      -- median/p90 computed in the /stats handler over the same row set
    dashboard: /stats "Entry speed" card (7-day median + p90 vs 5s/10s thresholds)
    alert: none-automated; weekly manual review (single user)

  - id: KPI-2
    name: logging-adherence
    type: leading
    north_star: true
    target: { days_per_week: 6, consecutive_weeks: 4 }
    baseline: "5-6/7 self-reported in old app"
    instrument: none — derived from the entry record itself
    storage: entries table
    query: |
      SELECT strftime('%Y-%W', date) week, COUNT(*) days_logged
      FROM entries GROUP BY week ORDER BY week DESC LIMIT 8;
    dashboard: /stats "Adherence" card (last 8 ISO weeks, 6/7 threshold marker)
    alert: none-automated; weekly manual review

  - id: KPI-3
    name: trend-view-opens
    type: leading
    target: { sessions_per_week: 3 }
    baseline: 0
    # REDEFINED by graph-first-home (2026-07-24, A19/ADR-009): deliberate trend
    # study = History-page opens (trend.study.opened) + explicit lens/scale
    # interactions on either surface (trend.study.interaction). Ambient renders
    # (front-page open at defaults, post-save refresh) add 0 by construction.
    # Q2 resolved at DISTILL: the /stats reading is the RAW rolling-week event
    # count (trend_study_this_week), no read-time session collapse; write-time
    # stays raw either way. trend_view_opened_count remains as a frozen
    # historical counter (instrument switch documented on /stats). A further
    # KPI-3 decline after ship is an EXPECTED substitution, not a regression;
    # retire or retarget at a weekly review if it stabilizes near zero.
    instrument: trend.study.opened + trend.study.interaction events (was
      trend_view_opened, frozen 2026-07-24)
    storage: events table
    query: |
      SELECT strftime('%Y-%W', ts) week, COUNT(*) engagements
      FROM events WHERE name IN ('trend.study.opened', 'trend.study.interaction')
      GROUP BY week ORDER BY week DESC LIMIT 8;
    dashboard: /stats "Trend engagement" card (trend_study_this_week)
    alert: none-automated; weekly manual review

  - id: KPI-5
    name: glance-presence
    type: leading
    target: { glance_days_pct_of_logging_days: 95, window: last 8 ISO weeks }
    baseline: "0% (trend only reachable via /graph before home-trend-display)"
    instrument: trend.glance.shown event paired with entry.saved per calendar day
    storage: events table
    query: |
      WITH logged AS (SELECT DISTINCT date(ts) d FROM events WHERE name = 'entry.saved'),
           glanced AS (SELECT DISTINCT date(ts) d FROM events WHERE name = 'trend.glance.shown')
      SELECT COUNT(*) logging_days,
             SUM(EXISTS (SELECT 1 FROM glanced WHERE glanced.d = logged.d)) glance_days
      FROM logged;
      -- presence % = glance_days / logging_days, surfaced on /stats
    dashboard: /stats glance pairing (alongside trend_glance_shown_count — glance
      deliveries over the same rolling 7-day window as trend_views_this_week; shipped
      semantics confirmed at DELIVER 2026-07-23)
    alert: none-automated; weekly manual review. KPI-3 note — a decline in deliberate
      trend-view opens after this ships is an EXPECTED substitution, not a regression.

  - id: KPI-7
    name: ambient-graph-presence
    type: leading
    target: { graph_days_pct_of_logging_days: 95, window: last 8 ISO weeks }
    baseline: "0% (curve only behind the History tap before graph-first-home)"
    instrument: home.graph.shown event paired with entry.saved per calendar day
      (read-time pairing, KPI-5 precedent; server-side delivery proxy per Q3)
    storage: events table
    query: |
      WITH logged AS (SELECT DISTINCT date(ts) d FROM events WHERE name = 'entry.saved'),
           pictured AS (SELECT DISTINCT date(ts) d FROM events WHERE name = 'home.graph.shown')
      SELECT COUNT(*) logging_days,
             SUM(EXISTS (SELECT 1 FROM pictured WHERE pictured.d = logged.d)) graph_days
      FROM logged;
      -- presence % = graph_days / logging_days, surfaced on /stats
    dashboard: /stats ambient pairing card (home_graph_shown_this_week beside
      trend_study_this_week — ambient vs deliberate, same rolling week)
    alert: none-automated; weekly manual review

  - id: KPI-4
    name: subscription-cancelled
    type: lagging
    target: { within_days_of_slice_04: 30 }
    baseline: subscription active ($30/month)
    instrument: manual, self-verified
    storage: none
    query: n/a
    dashboard: iteration-close checklist item
    alert: calendar reminder at Slice-04-ship + 30 days (manual)

guardrails:
  - id: G-1
    name: zero-lost-entries
    rpo_statement: >
      Litestream streams WAL segments continuously (typical replication delay: seconds).
      The 15-minute lag alert threshold is the declared RPO bound: at ~1 entry/day, a
      15-minute worst-case loss window bounds exposure to at most one un-replicated entry,
      while staying well above UptimeRobot's 5-minute poll interval and normal WAL-segment
      upload jitter (avoids false-positive alert noise for a solo operator).
    instrument:
      healthz: /healthz reports last successful replication timestamp; alert if lag > 15 min
      restore_drill:
        cadence: weekly cron (GitHub Actions); every 4th run additionally exercises
          point-in-time restore (litestream restore -timestamp <now - 7 days>) to a second
          scratch path + integrity check — proves the PITR data-rollback path, not just
          latest-generation restore
        procedure: litestream restore to CI scratch -> PRAGMA integrity_check = ok ->
          entries count comparison (valid invariant — entries are replace-only, never deleted)
        state_mechanism:
          artifact_name: restore-drill-state
          content: '{run_ts, entries_count, restored_wal_ts} JSON'
          retention_days: 90   # >> weekly cadence; comparison window never expires
          compare: download most recent restore-drill-state artifact; assert
            entries_count_restored >= previous.entries_count; upload new state artifact
          first_run: no prior artifact found -> skip comparison, record baseline,
            log drill.baseline.recorded
    alert:
      - "UptimeRobot email: /healthz non-200 or replication lag > 15 min (5-min poll)"
      - "restore drill workflow failure -> GitHub email notification"
    runbook: docs/product/architecture/runbook-restore.md
  - id: G-2
    name: graph-interactive-2s
    instrument: acceptance test (@property) in CI on every push
    alert: red main blocks deploy
  - id: G-3
    name: trend-determinism
    instrument: acceptance test (@property, fixed entry set -> identical line) in CI
    alert: red main blocks deploy

