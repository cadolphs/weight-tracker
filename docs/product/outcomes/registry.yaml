- id: OUT-11
  kind: invariant
  summary: KPI-1 sample purity — a repair is never counted as a morning
  feature: entry-date-picker
  inputs:
  - shape: any save whose date is not the day the phone claims as its own (skew-clamped;
      an absent or garbled claim falls back to the server's UTC day and never refuses
      the save)
  output:
    shape: >
      entry_ms recorded as NULL — 0 entry-speed samples and an unmoved weekly
      median, however slow the repair was — plus "backdated": true on the entry.saved
      payload, counted on /stats as backdated_saves_this_week (KPI-8); the save's effect
      universe stays one {date} row + one entry.saved event; the trail, not
      entries.entry_ms, is KPI-1's source of truth
  keywords:
  - kpi-1-purity
  - backdated-save
  - write-time-classification
  - repair-vs-morning
  - adr-011
  artifact: tests/weight-trend-tracker/acceptance/milestone-10-dated-entry.feature
  related:
  - OUT-1
  - OUT-9
  superseded_by: null
  # Registered manually at DISTILL (2026-07-24): same CLI defect as OUT-8/OUT-9.
- id: OUT-12
  kind: specification
  summary: Y-axis range rule -- pure projection over the plotted values (>= 2.0 kg visible span,
    floor widens never clips, bounds snapped outward to 0.5 kg)
  feature: y-axis-floor
  inputs:
  - shape: the values a lens plots for a window (raw weight_kg of the windowed entries, or
      trend_kg of the windowed smoothed points); gap nulls never reach the rule
  output:
    shape: >
      [lo, hi] | none -- none iff nothing is plotted; span < 2.0 kg => [mid - 1.0, mid + 1.0];
      span >= 2.0 kg => min/max padded by a tenth of the span each side (explicit formula, not
      a chart-library replay); then both bounds snap OUTWARD to the 0.5 kg grid (epsilon-tolerant).
      Guarantees: lo <= min, max <= hi, hi - lo >= 2.0, bounds in 0.5*Z; below the floor the band
      is 2.0-3.0 kg wide with its centre within 0.25 kg of the data midpoint. Served as the
      additive `y_range` on both series reads (OUT-2, OUT-3); the series is untouched (OUT-5).
  keywords:
  - y-axis-floor
  - honest-axis
  - minimum-visible-span
  - outward-snap
  - adr-012
  artifact: tests/weight-trend-tracker/acceptance/milestone-11-honest-axis.feature
  related:
  - OUT-2
  - OUT-3
  - OUT-5
  superseded_by: null
  # Registered manually at DISTILL (2026-09-04): same CLI defect as OUT-8..OUT-11 (see header note).
