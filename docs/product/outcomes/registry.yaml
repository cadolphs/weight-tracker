schema_version: "0.1"
# NOTE (2026-07-22): entries written manually in the CLI's canonical outcome_to_dict shape.
# `nwave-ai outcomes register` (v3.20 tool install) fails with FileNotFoundError on a
# mis-packaged schema.json (site-packages/docs/product/outcomes/schema.json) — tool defect,
# exit 1 (not the exit-2 duplicate contract). Re-run registrations via CLI once fixed upstream.
outcomes:
- id: OUT-1
  kind: operation
  summary: WeightLogging.record_or_replace — capture or replace one day's weight
  feature: weight-trend-tracker
  inputs:
  # AMENDED at DISTILL of entry-date-picker (2026-07-24, ADR-011): the save message
  # gains ONE additive, optional, backward-compatible field — `today`, the phone's own
  # calendar day. Absent (curl/API clients, every pre-existing caller) means the server's
  # UTC day frames the judgement; a garbled claim is treated the same way. It NEVER
  # rejects a save. The port protocol itself is unchanged (ports.py untouched).
  - shape: date (device-local ISO day), raw weight string, optional entry_ms,
      optional today (the phone's claimed day)
  output:
    shape: Saved{date, weight_kg, confirmation} | Rejected{reason from closed set}
  keywords:
  - weight-logging
  - record-or-replace
  - one-per-day
  - validation
  - driving-port
  artifact: tests/weight-trend-tracker/acceptance/milestone-1-log-todays-weight.feature
  related: []
  superseded_by: null
- id: OUT-2
  kind: operation
  summary: WeightHistory.entries_in — raw record within a selected time scale
  feature: weight-trend-tracker
  inputs:
  - shape: time scale (1W|1M|3M|6M|1Y|ALL)
  # AMENDED at DISTILL of y-axis-floor (2026-09-04, ADR-012): the read gains ONE additive,
  # optional key -- `y_range`, the honest axis for the windowed raw values (>= 2.0 kg tall,
  # bounds snapped outward to the 0.5 kg grid; null iff nothing is plotted). A pure
  # projection of the same read; the port protocol is unchanged (no method added).
  output:
    shape: >
      raw entries newest-first within window; empty-state invite; yesterday reference
      + additive `y_range: [lo, hi] | null`
  keywords:
  - weight-history
  - entries-in
  - window
  - read-only
  - gaps-stay-gaps
  artifact: tests/weight-trend-tracker/acceptance/milestone-2-review-history.feature
  related: []
  superseded_by: null
- id: OUT-3
  kind: operation
  summary: TrendProjection.trend_series_in — smoothed trend on the daily grid
  feature: weight-trend-tracker
  inputs:
  - shape: time scale (1W|1M|3M|6M|1Y|ALL)
  # AMENDED at DISTILL of y-axis-floor (2026-09-04, ADR-012): same additive `y_range`
  # as OUT-2, over the windowed trend values -- ONE rule for both lenses (D7/A29). The
  # series itself is byte-identical (G-3); the port protocol is unchanged.
  output:
    shape: >
      smoothed TrendPoint series on daily calendar grid (Kalman+RTS, ADR-004), derived never
      stored + additive `y_range: [lo, hi] | null`
  keywords:
  - trend-projection
  - kalman
  - rts-smoother
  - gap-robust
  - read-only
  artifact: tests/weight-trend-tracker/acceptance/milestone-4-trend-through-noise.feature
  related: []
  superseded_by: null
