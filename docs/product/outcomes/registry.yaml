- id: OUT-8
  kind: operation
  summary: Trend-study beacon — explicit lens/scale taps recorded as deliberate study
  feature: graph-first-home
  inputs:
  - shape: 'POST /telemetry/trend-study {surface: home|history, control: lens|scale,
      value: trend|raw|1W|1M|3M|6M|1Y|ALL} (closed vocabulary, behind AccessGate)'
  output:
    shape: exactly one trend.study.interaction event append | 400 on unknown vocabulary
      (never 500, never a trail write) | refused at the door without a session
  keywords:
  - telemetry-beacon
  - trend-study
  - closed-vocabulary
  - deliberate-study
  - adr-009
  artifact: tests/weight-trend-tracker/acceptance/milestone-8-graph-first-front-page.feature
