schema_version: 1

journey:
  name: "Daily Weight Tracking"
  goal: "Capture today's weight in seconds and judge real progress via a smoothed trend"
  persona: clemens # docs/product/personas/clemens.yaml
  job_id: track-true-weight-trend # docs/product/jobs.yaml
  platform: "web, mobile-first (phone browser / home-screen launch)"

  emotional_arc:
    start: "Half-awake routine — zero cognitive load tolerated; entry must be automatic"
    middle: "Micro-satisfaction — visible 'Saved' confirmation closes the loop instantly"
    end: "Reassured confidence — trend view resolves raw-weight anxiety into signal"
    pattern: "Problem Relief within Review step: raw spike (frustration) -> trend view (relief)"

steps:
  - id: 1
    name: "Log today's weight"
    action: "Tap home-screen icon -> entry screen opens graph-first: trend graph (full lens + scale controls) above the form, today's date preselected, numeric field focused, last-7 entries beneath"
    screen_sketch: |
      +--------------------------------------+
      | Fri 24 Jul 2026            [today]   |
      | [Trend|Raw] [1W 1M 3M 6M 1Y All]     |  <- full controls (graph-first-home)
      |   ~~~~~ trend curve, 3M ~~~~~        |  <- ambient render; NEVER counts as deliberate study
      | Trend: 82.3 kg · ↓0.25 kg/week       |  <- glance line kept (home-trend-display)
      |   Weight:  [ 82.2      ] kg          |
      |   (yesterday: 82.4 kg)               |
      |            [  Save  ]                |
      | Thu 23 Jul — 82.4 kg                 |  <- last 7 ENTRIES, display-only
      | Wed 22 Jul — 82.6 kg  …              |
      |   [History] -> full graph + list     |
      +--------------------------------------+
      | Saved: 82.2 kg -- Fri 24 Jul         |
      | graph + glance + list refresh in place|
      +--------------------------------------+
    shared_artifacts:
      - name: "weight_entry"
        source: "entry store (single source of truth for {date, weight_kg})"
        displayed_as: "confirmation line, history graph point, trend input, recent/complete list rows"
        consumers: ["step 1 confirmation", "step 1 front-page graph + last-7 list (graph-first-home)", "step 2 raw graph + complete history list", "step 3 trend", "step 4 edit form"]
      - name: "today_date"
        source: "device-local calendar date"
        displayed_as: "preselected date, one-entry-per-day key"
        consumers: ["step 1 default date", "one-per-day rule", "step 1 yesterday anchor (device day, fix-device-day-reads)", "steps 2-3 window frame (?today= from device, fix-device-day-reads)", "step 4 picker default + max bound + post-save reset (entry-date-picker)"]
      - name: "unit_label_kg"
        source: "single UI constant (metric only)"
        displayed_as: "'kg' suffix"
        consumers: ["entry field", "confirmation", "graph axes"]
      - name: "current_trend_display"
        source: "TrendProjection (derived from entry store per read; never stored — same smoothed series as step 3)"
        displayed_as: "'Trend: 82.3 kg · ↓0.25 kg/week' glance line; rate only when record spans >=7 days"
        consumers: ["step 1 glance line (pre-save and post-save refresh)", "step 1 front-page graph (graph-first-home; same smoothed series)", "step 3 trend view (same series)"]
    emotional_state: { entry: "routine, half-awake", exit: "done and oriented — knows where he stands and which way he's moving" }
    integration_checkpoint: "Saved entry is immediately visible in history (steps 2-3 read the same store); glanced trend value equals the graph's trend line for the same entry set (single smoothed series)"
    failure_modes:
      - "Typo out of plausible range (824 instead of 82.4)"
      - "Empty submit"
      - "Second entry same day (must update, never duplicate)"
      - "Save fails / offline — entry silently lost would break trust"
      - "Logging just after midnight attributed to wrong day (device-local day is canonical)"
      - "Trend lookup failure blocks or delays entry (must degrade to absent glance line; save unaffected)"
      - "Home glance inflating the deliberate trend-view KPI counter (must be counted separately)"
      - "Weekly rate shown on a days-old record (noise dressed as insight; hold rate until >=7-day span)"
      - "Bright light-theme screen in a dark bathroom at 06:45 (presentation must follow the system color scheme)" # calm-visual-theme
      - "Evening render shows the next-day frame (read surfaces — yesterday anchor, graph windows — must use the device day, never server UTC)" # fix-device-day-reads
      - "Ambient front-page graph render counted as deliberate trend study (KPI-3 inflation ~7x; ambient renders — page open at defaults, post-save refresh — must never increment the deliberate counter)" # graph-first-home
      - "Front-page graph or recent-list fetch blocking or delaying entry readiness (must degrade to absent; <=2 s interactive and save flow unaffected)" # graph-first-home
      # NOTE (graph-first-home, locked D6): the keypad covering the graph on open is ACCEPTED, not a failure — autofocus + decimal keypad take priority.
    gherkin: |
      Scenario: Morning weight is captured in seconds
        Given it is Monday 21 July 2026 at 06:45 and Clemens has not logged today
        When he opens the tracker, types "82.4" and taps Save
        Then he sees "Saved: 82.4 kg -- Mon 21 Jul"
        And today's entry appears in his history

      Scenario: The trend is one glance away while logging
        Given Clemens's smoothed trend is 82.3 kg, declining 0.25 kg/week
        When he opens the tracker on Thursday 23 July 2026
        Then he sees "Trend: 82.3 kg · ↓0.25 kg/week" beside the entry form
        And after saving today's weight the glance line refreshes in place without a reload

  - id: 2
    name: "Review raw history"
    action: "Ambient: front-page graph (graph-first-home). Deliberate: 'History' opens the combined full-history page — full-control graph + COMPLETE entries list below; pick time scale (1W / 1M / 3M / 6M / 1Y / All)"
    emotional_state: { entry: "curious", exit: "informed" }
    integration_checkpoint: "Graph renders exactly the stored entries — no interpolation, gaps stay gaps; the complete list shows the same stored entries the plot renders"
    failure_modes:
      - "Missing days rendered as zeros or fake interpolated points (must be gaps)"
      - "Graph unreadable on phone viewport"
      - "Chart axes, gridlines, or series strokes illegible in the dark color scheme" # calm-visual-theme
      - "Complete entries list and plotted points disagree (both must render exactly the stored entries)" # graph-first-home
    gherkin: |
      Scenario: History is readable at the chosen time scale
        Given Clemens has 45 daily entries between March and July 2026
        When he opens the graph and selects "3M"
        Then only the last three months of entries are plotted in kg
        And days without an entry show no data point

  - id: 3
    name: "Judge the trend"
    action: "Ambient every morning on the front-page graph (graph-first-home); deliberate study on the History page; trend is the default lens; toggle Trend <-> Raw on either surface"
    emotional_state: { entry: "possibly anxious after a raw spike", exit: "reassured — noise vs signal resolved" }
    integration_checkpoint: "Trend and raw views share the same selected time scale and the same entry store"
    failure_modes:
      - "Trend jumps or shows discontinuity across missing-day gaps"
      - "Trend overreacts to a single-day spike (defeats its purpose)"
      - "Trend lags so much that real change is invisible for weeks"
    gherkin: |
      Scenario: A restaurant-night spike is revealed as noise
        Given Clemens's trend has been stable around 82.3 kg
        And he logs 83.6 kg the morning after a sushi dinner
        When he opens the trend view
        Then the trend moves by no more than 0.3 kg
        And toggling to Raw shows the 83.6 kg point at the same time scale

  - id: 4
    name: "Maintain the record"
    action: "On the entry screen, change the date field (native picker, defaults to today, max today) to a past day; field prefills the stored value with an 'Editing …' hint, or clears with 'No entry … yet' for a gap; save corrects or backfills via the one-per-day upsert; date resets to today after save" # entry-date-picker
    emotional_state: { entry: "mild annoyance (gap/typo noticed)", exit: "trust restored — on the same screen, in seconds" }
    integration_checkpoint: "After a past-day change, raw graph and trend recompute over the affected range; front-page graph, glance line, and recent list refresh in place via the same save response"
    failure_modes:
      - "Future-dated entry accepted"
      - "Editing a past day creates a duplicate instead of replacing"
      - "Derived trend not recomputed after correction"
      - "Blind overwrite: past day edited without the stored value shown (prefill + editing hint required)" # entry-date-picker
      - "Habit-typing after a backdated save overwriting the same past day (date must reset to today post-save)" # entry-date-picker
      - "Maintenance saves polluting the KPI-1 morning-speed samples (backdated saves must add 0 samples)" # entry-date-picker
      - "Date row taxing the default morning flow (must stay zero extra taps, autofocus + keypad unchanged)" # entry-date-picker
    gherkin: |
      Scenario: A forgotten day is backfilled
        Given Clemens forgot to log Sunday 20 July 2026
        When he selects 20 July and saves 82.6 kg
        Then the entry appears dated 20 July
        And the raw graph and trend include it

      Scenario: A mistyped value is corrected in place
        Given the stored entry for Tuesday 21 July 2026 is 88.4 kg
        When he selects 21 July, sees the field prefilled with 88.4, and saves 82.4 kg
        Then exactly one entry exists for 21 July, at 82.4 kg
        And the trend recomputes without the phantom spike

integration_validation:
  shared_artifact_consistency:
    - artifact: "weight_entry"
      must_match_across: [1, 2, 3, 4]
      failure_message: "Entry visible at save must be identical in graph, trend input, and edit form"
    - artifact: "selected_time_scale"
      must_match_across: [2, 3]
      failure_message: "Toggling Trend<->Raw must preserve the chosen time scale — on each surface independently (front page and History page each hold their own selection; no cross-surface persistence, graph-first-home A17)"
    - artifact: "current_trend_display"
      must_match_across: [1, 3]
      failure_message: "Trend value glanced at the entry screen must equal the graph's trend line for the same entries (one smoothed series, no second algorithm)"

changelog:
  - date: "2026-07-21"
    feature: "weight-trend-tracker"
    change: "Initial journey created (DISCUSS wave, greenfield bootstrap)"
  - date: "2026-07-23"
    feature: "home-trend-display"
    change: "Step 1 extended: glanceable trend + weekly rate on the entry screen with in-place post-save refresh; new shared artifact current_trend_display (source TrendProjection) with step 1<->3 consistency rule; failure modes added (degrade-to-absent, KPI-counter separation, sparse-rate honesty); step 1 exit emotion now 'done and oriented'. Steps 2-4 untouched."
  - date: "2026-07-24"
    feature: "fix-device-day-reads"
    change: "Bugfix (nw-bugfix RCA): A5 extended from writes to reads. Yesterday anchor now rendered phone-side from a recent-days map; /entries and /trend accept a validated, skew-bounded ?today= from the device; ClockPort contract tightened (UTC only for sanity bound, telemetry, /stats). New failure mode + today_date consumers recorded."
  - date: "2026-07-23"
    feature: "calm-visual-theme"
    change: "Presentation-only delta: calm-minimal theme following the system color scheme across entry, graph, and door screens. No step, flow, or shared-artifact changes. Failure modes added: bright screen in dark bathroom (step 1), dark-scheme chart illegibility (step 2/3). Zero-friction start of the emotional arc is a protected guardrail (KPI-1 unchanged)."
  - date: "2026-07-24"
    feature: "graph-first-home"
    change: "Step 1 restructured graph-first: full-control trend graph (lens + scale) above the entry form, glance line kept, last-7 display-only entries list below; graph/glance/list refresh in place after save. Steps 2/3 now start ambient on the front page; 'History' = deliberate visit to the combined page (full graph + complete entries list). Failure modes added: ambient render counted as deliberate study (KPI-3 inflation), graph/list fetch blocking entry, list/plot disagreement; keypad covering the graph on open is ACCEPTED (locked D6), noted, not a failure. selected_time_scale rule scoped per surface (no cross-surface persistence). Entry primacy (autofocus, keypad, <=2 s) unchanged."
  - date: "2026-07-24"
    feature: "entry-date-picker"
    change: "Step 4 gains its mechanism (DISCUSS): the entry screen's native date field (default today, max today) IS the maintenance surface — backfill and correct ride the existing one-per-day upsert. Prefill-with-hint for stored days, no-entry hint for gaps, single hint line shared with the yesterday anchor, post-save reset to today. Failure modes added: blind overwrite, habit-typing clobber, KPI-1 sample pollution, date-row friction. today_date consumers extended (picker default + max + reset). Steps 2-3 untouched; step 1 unchanged in tap count."
